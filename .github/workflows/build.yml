name: Build installers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: win32
            arch: x64
          - name: macos-arm64
            os: macos-latest
            platform: darwin
            arch: arm64
          - name: macos-x64
            os: macos-15-intel
            platform: darwin
            arch: x64
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Build distributables
        run: npm run make -- --arch=${{ matrix.arch }}

      - name: Verify macOS architecture and code signature
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/verify-macos-package.sh "${{ matrix.arch }}"

      - name: Prepare clearly named distributables
        run: npm run prepare:release-assets -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/release-assets/*
          if-no-files-found: error
